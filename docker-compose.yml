services:
  postgres:
    image: postgres:16
    container_name: foodie-postgres
    environment:
      POSTGRES_USER: foodie
      POSTGRES_PASSWORD: foodie
      POSTGRES_DB: foodie
    ports:
      - "5432:5432"
    volumes:
      - foodie-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodie"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  foodie-pgdata:
